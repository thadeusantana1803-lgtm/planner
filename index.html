<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="view"></main>

<button id="fab" class="fab" data-action="new-task" aria-label="Nova tarefa">+</button>

<nav class="tabs" aria-label="Seções">
  <button class="tab" data-action="tab" data-tab="hoje">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
    <span>Hoje</span>
  </button>
  <button class="tab" data-action="tab" data-tab="mes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Mês</span>
  </button>
  <button class="tab" data-action="tab" data-tab="pend">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>
    <span>Pendências</span>
    <b id="pendBadge" class="badge" hidden>0</b>
  </button>
  <button class="tab" data-action="tab" data-tab="cats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="7" cy="17" r="3.2"/><circle cx="17" cy="17" r="3.2"/></svg>
    <span>Categorias</span>
  </button>
  <button class="tab" data-action="tab" data-tab="cfg">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
